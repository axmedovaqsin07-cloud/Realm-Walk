<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<title>Krallık Haritası</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b0f14;--panel:#121921;--line:#222d3a;--tx:#eaf0f6;--mt:#8a9bad;--ember:#ff6b2c;--ember2:#ffb347}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.disp{font-family:Unbounded,Manrope,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px}
header b{font:600 15px Unbounded,Manrope,sans-serif;letter-spacing:.01em}
#me{font-size:12.5px;color:var(--mt);border:1px solid var(--line);border-radius:99px;padding:4px 10px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mapwrap{position:relative;flex:1 1 52%;min-height:260px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#map{position:absolute;inset:0;background:#0f151c}
.leaflet-control-attribution{background:rgba(11,15,20,.7)!important;color:var(--mt)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--mt)!important}
#bar{position:absolute;left:10px;right:10px;bottom:22px;z-index:1000;display:flex;gap:10px;align-items:center;padding:10px 10px 10px 14px;border-radius:16px;background:rgba(11,15,20,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line)}
#info{flex:1;font-size:13px;color:var(--mt)}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--ember);color:#1a0a02;font-weight:800;box-shadow:0 6px 22px rgba(255,107,44,.35)}
button.sec{background:#243142;color:var(--tx);font-weight:600;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ember2);outline-offset:2px}
.tabs{display:flex;background:var(--bg)}
.tabs button{flex:1;background:none;color:var(--mt);border-radius:0;font-weight:600;box-shadow:none;border-bottom:2px solid var(--line);padding:12px 4px}
.tabs button.on{color:var(--tx);border-color:var(--ember)}
.pane{display:none;flex:1 1 34%;overflow:auto;padding:8px 14px;min-height:140px}.pane.on{display:block}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row b{white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;box-shadow:0 0 8px currentColor}
.mt{color:var(--mt);font-size:13px}
input,select{font:inherit;width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
#join{position:fixed;inset:0;z-index:2000;background:var(--bg);padding:28px 22px;overflow:auto;padding-top:calc(40px + env(safe-area-inset-top,0px))}
#join h1{font:700 26px/1.15 Unbounded,Manrope,sans-serif;margin:0 0 10px}
#join.hide{display:none}
#log{max-height:28vh;overflow:auto}
#splash{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#1b2733,#0b0f14 68%);transition:opacity .6s}
#splash.gone{opacity:0;pointer-events:none}
.sp-spark{width:84px;height:84px;filter:drop-shadow(0 0 22px rgba(255,107,44,.7));animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
.sp-name{font:700 25px Unbounded,Manrope,sans-serif;margin-top:22px;animation:rise .8s .35s both}
.sp-by{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--mt);letter-spacing:.04em;animation:rise .8s .7s both}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sp-spark,.sp-name,.sp-by{animation:none}#splash{transition:none}}
</style>

</head>
<body>
<div id="splash">
  <svg class="sp-spark" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6b2c"/></linearGradient></defs><path fill="url(#g)" d="M50 4C54 32 68 46 96 50 68 54 54 68 50 96 46 68 32 54 4 50 32 46 46 32 50 4Z"/></svg>
  <div class="sp-name">DevSpark Akademi</div>
  <div class="sp-by">Powered by Akhmedov</div>
</div>
<div id="join">
  <h1 data-i="title">Krallık Haritası</h1>
  <p class="mt" data-i="intro"></p>
  <input id="nm" data-p="nick" maxlength="20">
  <select id="ks"><option value="">Mevcut krallığa katıl…</option></select>
  <input id="nk" data-p="newK" maxlength="24">
  <button id="go" data-i="start" style="width:100%;margin-top:8px"></button>
  <p class="mt" id="st"></p>
</div>
<div id="app">
  <header><b data-i="title"></b><span id="me"></span></header>
  <div id="mapwrap"><div id="map"></div>
  <div id="bar"><span id="info" data-i="info0"></span><button id="walk" data-i="walkStart"></button></div></div>
  <div class="tabs"><button class="on" data-t="lb" data-i="lb"></button><button data-t="kg" data-i="kg"></button><button data-t="ch" data-i="ch"></button></div>
  <div class="pane on" id="lb"></div>
  <div class="pane" id="kg"></div>
  <div class="pane" id="ch">
    <select id="chan"></select>
    <div id="log"></div>
    <input id="txt" data-p="msgPh" maxlength="200">
    <button id="send" class="sec" data-i="send" style="width:100%"></button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,onSnapshot,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 1) Firebase konsolundan aldığın ayarları buraya yapıştır
const firebaseConfig={
  apiKey:"AIzaSyAvOuVfBLEHoNuYxoAKdt8WGQ99uEzLoqE",
  authDomain:"kingdom-game-59492.firebaseapp.com",
  projectId:"kingdom-game-59492",
  storageBucket:"kingdom-game-59492.firebasestorage.app",
  messagingSenderId:"764529697121",
  appId:"1:764529697121:web:455dfbc27d6a898796e520"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const COLORS=["#ff5a5f","#4cc9f0","#ffd166","#c77dff","#06d6a0","#ff9f1c","#ff4d9d","#9ef01a"];
const $=i=>document.getElementById(i);
const esc=t=>{const d=document.createElement("div");d.textContent=t;return d.innerHTML};
const S={uid:null,me:null,kings:{},players:{},claims:[],chat:[],chan:"all"};

// ---------- Dil (telefonun / tarayıcının diline göre) ----------
const I18N={
tr:{title:"Krallık Haritası",intro:"Gerçek dünyada yürü, başladığın yere dön, çizdiğin alan senin olsun.",nick:"Takma adın",joinK:"Mevcut krallığa katıl…",newK:"…veya yeni krallık adı",start:"Oyuna başla",info0:"Yürüyüşü başlat ve başladığın noktaya geri dön.",walkStart:"Yürüyüşü başlat",cancel:"Vazgeç",lb:"Liderlik",kg:"Krallıklar",ch:"Sohbet",msgPh:"Mesaj yaz…",send:"Gönder",general:"Genel sohbet",myK:"Krallığım",members:"üye",noLand:"Henüz toprak yok. İlk sen al!",noKing:"Henüz krallık yok.",noMsg:"Henüz mesaj yok.",errNick:"Bir takma ad yaz.",errKing:"Bir krallık seç veya yeni bir tane yaz.",regFail:"Kayıt başarısız: {e}",authErr:"Giriş hatası: {e}",noGeo:"Bu cihazda konum desteklenmiyor.",needPerm:"Konum izni gerekli: {e}",weakGps:"GPS zayıf ({m} m). Açık alana çık.",tooFast:"Çok hızlısın (araçta mısın?). Bu nokta sayılmadı.",progress:"Yol: {len} m · Başlangıca: {d} m",goWalk:"Yürümeye başla!",tooSmall:"Alan çok küçük ({a}). Daha geniş bir döngü yürü.",tooBig:"Alan çok büyük, geçersiz.",claimed:"Yeni toprak: {a} 🎉",saveFail:"Kaydedilemedi: {e}",cancelled:"Yürüyüş iptal edildi."},
en:{title:"Kingdom Map",intro:"Walk the real world, return to where you started, and the area you traced is yours.",nick:"Your nickname",joinK:"Join an existing kingdom…",newK:"…or enter a new kingdom name",start:"Start playing",info0:"Start a walk and return to your starting point.",walkStart:"Start walk",cancel:"Cancel",lb:"Leaderboard",kg:"Kingdoms",ch:"Chat",msgPh:"Write a message…",send:"Send",general:"Global chat",myK:"My kingdom",members:"members",noLand:"No land yet. Be the first!",noKing:"No kingdoms yet.",noMsg:"No messages yet.",errNick:"Enter a nickname.",errKing:"Pick a kingdom or enter a new name.",regFail:"Sign-up failed: {e}",authErr:"Sign-in error: {e}",noGeo:"This device does not support location.",needPerm:"Location permission needed: {e}",weakGps:"Weak GPS ({m} m). Move to an open area.",tooFast:"Too fast (in a vehicle?). This point was skipped.",progress:"Path: {len} m · To start: {d} m",goWalk:"Start walking!",tooSmall:"Area too small ({a}). Walk a bigger loop.",tooBig:"Area too large, not valid.",claimed:"New land: {a} 🎉",saveFail:"Could not save: {e}",cancelled:"Walk cancelled."},
ka:{title:"სამეფოს რუკა",intro:"იარე რეალურ სამყაროში, დაბრუნდი საწყის წერტილში და შემოვლებული ტერიტორია შენი იქნება.",nick:"შენი მეტსახელი",joinK:"შეუერთდი არსებულ სამეფოს…",newK:"…ან ახალი სამეფოს სახელი",start:"თამაშის დაწყება",info0:"დაიწყე სიარული და დაბრუნდი საწყის წერტილში.",walkStart:"სიარულის დაწყება",cancel:"გაუქმება",lb:"ლიდერბორდი",kg:"სამეფოები",ch:"ჩატი",msgPh:"დაწერე შეტყობინება…",send:"გაგზავნა",general:"საერთო ჩატი",myK:"ჩემი სამეფო",members:"წევრი",noLand:"ტერიტორია ჯერ არ არის. პირველი შენ დაიკავე!",noKing:"სამეფო ჯერ არ არის.",noMsg:"შეტყობინება ჯერ არ არის.",errNick:"ჩაწერე მეტსახელი.",errKing:"აირჩიე სამეფო ან დაწერე ახალი.",regFail:"რეგისტრაცია ვერ მოხერხდა: {e}",authErr:"შესვლის შეცდომა: {e}",noGeo:"ამ მოწყობილობაზე მდებარეობა მხარდაჭერილი არ არის.",needPerm:"საჭიროა მდებარეობის ნებართვა: {e}",weakGps:"სუსტი GPS ({m} მ). გადი ღია ადგილას.",tooFast:"ძალიან სწრაფად მოძრაობ (მანქანაში ხარ?). ეს წერტილი არ ჩაითვალა.",progress:"გზა: {len} მ · საწყისამდე: {d} მ",goWalk:"დაიწყე სიარული!",tooSmall:"ტერიტორია ძალიან მცირეა ({a}). გაიარე უფრო დიდი წრე.",tooBig:"ტერიტორია ძალიან დიდია, არასწორია.",claimed:"ახალი ტერიტორია: {a} 🎉",saveFail:"შენახვა ვერ მოხერხდა: {e}",cancelled:"სიარული გაუქმებულია."},
de:{title:"Königreichskarte",intro:"Lauf in der echten Welt, kehre zum Startpunkt zurück und das umrundete Gebiet gehört dir.",nick:"Dein Spitzname",joinK:"Einem Königreich beitreten…",newK:"…oder neuen Königreichsnamen eingeben",start:"Spiel starten",info0:"Starte den Spaziergang und kehre zum Startpunkt zurück.",walkStart:"Spaziergang starten",cancel:"Abbrechen",lb:"Rangliste",kg:"Königreiche",ch:"Chat",msgPh:"Nachricht schreiben…",send:"Senden",general:"Allgemeiner Chat",myK:"Mein Königreich",members:"Mitglieder",noLand:"Noch kein Land. Sei der Erste!",noKing:"Noch keine Königreiche.",noMsg:"Noch keine Nachrichten.",errNick:"Gib einen Spitznamen ein.",errKing:"Wähle ein Königreich oder gib einen neuen Namen ein.",regFail:"Registrierung fehlgeschlagen: {e}",authErr:"Anmeldefehler: {e}",noGeo:"Dieses Gerät unterstützt keine Standortbestimmung.",needPerm:"Standortfreigabe erforderlich: {e}",weakGps:"Schwaches GPS ({m} m). Geh ins Freie.",tooFast:"Zu schnell (im Fahrzeug?). Dieser Punkt zählt nicht.",progress:"Strecke: {len} m · bis zum Start: {d} m",goWalk:"Los geht's!",tooSmall:"Gebiet zu klein ({a}). Lauf eine größere Runde.",tooBig:"Gebiet zu groß, ungültig.",claimed:"Neues Land: {a} 🎉",saveFail:"Speichern fehlgeschlagen: {e}",cancelled:"Spaziergang abgebrochen."},
ru:{title:"Карта королевств",intro:"Иди по настоящему городу, вернись в начальную точку, и обведённая территория станет твоей.",nick:"Твой ник",joinK:"Вступить в королевство…",newK:"…или введи название нового",start:"Начать игру",info0:"Начни прогулку и вернись в начальную точку.",walkStart:"Начать прогулку",cancel:"Отмена",lb:"Рейтинг",kg:"Королевства",ch:"Чат",msgPh:"Напиши сообщение…",send:"Отправить",general:"Общий чат",myK:"Моё королевство",members:"участн.",noLand:"Земель пока нет. Будь первым!",noKing:"Королевств пока нет.",noMsg:"Сообщений пока нет.",errNick:"Введи ник.",errKing:"Выбери королевство или введи новое название.",regFail:"Не удалось зарегистрироваться: {e}",authErr:"Ошибка входа: {e}",noGeo:"Это устройство не поддерживает геолокацию.",needPerm:"Нужен доступ к геолокации: {e}",weakGps:"Слабый GPS ({m} м). Выйди на открытое место.",tooFast:"Слишком быстро (на транспорте?). Точка не засчитана.",progress:"Путь: {len} м · до старта: {d} м",goWalk:"Иди!",tooSmall:"Территория слишком мала ({a}). Пройди круг побольше.",tooBig:"Территория слишком большая, недействительна.",claimed:"Новая земля: {a} 🎉",saveFail:"Не удалось сохранить: {e}",cancelled:"Прогулка отменена."}
};
const lang=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]).map(l=>l.slice(0,2).toLowerCase()).find(l=>I18N[l])||"en";
const t=(k,v={})=>String((I18N[lang][k]||I18N.en[k]||k)).replace(/\{(\w+)\}/g,(_,x)=>v[x]);
document.documentElement.lang=lang;document.title=t("title");
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));


// ---------- Harita ----------
const map=L.map("map",{zoomControl:false}).setView([41.0082,28.9784],15);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:20,attribution:"© OpenStreetMap © CARTO"}).addTo(map);
const claimLayer=L.layerGroup().addTo(map);
const trail=L.polyline([],{color:"#ff6b2c",weight:5,dashArray:"8 8"}).addTo(map);
let meMarker=null,startMarker=null,centered=false;
const colorOf=k=>(S.kings[k]&&S.kings[k].color)||"#888";

// ---------- Ölçümler ----------
const T=Math.PI/180,R=6371000;
function dist(a,b){const x=Math.sin((b.lat-a.lat)*T/2)**2+Math.cos(a.lat*T)*Math.cos(b.lat*T)*Math.sin((b.lng-a.lng)*T/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function areaM2(p){const l0=p[0].lat*T,q=p.map(c=>[R*c.lng*T*Math.cos(l0),R*c.lat*T]);let a=0;for(let i=0;i<q.length;i++){const j=(i+1)%q.length;a+=q[i][0]*q[j][1]-q[j][0]*q[i][1]}return Math.abs(a/2)}
const fmt=a=>a>=1e6?(a/1e6).toFixed(2)+" km²":Math.round(a).toLocaleString(lang)+" m²";

// ---------- Yürüyüş ----------
let walk=null,watch=null;
function say(t){$("info").textContent=t}
function onPos(pos){
  const c={lat:pos.coords.latitude,lng:pos.coords.longitude,t:pos.timestamp};
  if(pos.coords.accuracy>40){if(walk)say(t("weakGps",{m:Math.round(pos.coords.accuracy)}));return}
  if(!meMarker)meMarker=L.circleMarker([c.lat,c.lng],{radius:8,color:"#fff",weight:3,fillColor:"#4cc9f0",fillOpacity:1}).addTo(map);
  else meMarker.setLatLng([c.lat,c.lng]);
  if(!centered){map.setView([c.lat,c.lng],17);centered=true}
  if(!walk)return;
  const last=walk.pts[walk.pts.length-1],d=dist(last,c);
  if(d<6)return;
  const dt=(c.t-last.t)/1000;
  if(dt>0&&d/dt>8){say(t("tooFast"));return}
  walk.pts.push(c);walk.len+=d;trail.addLatLng([c.lat,c.lng]);
  const toStart=dist(c,walk.pts[0]);
  say(t("progress",{len:Math.round(walk.len),d:Math.round(toStart)}));
  if(walk.pts.length>=8&&walk.len>=150&&toStart<35)finish();
}
function startWalk(){
  if(!navigator.geolocation){say(t("noGeo"));return}
  const go=pos=>{
    onPos(pos);
    const c={lat:pos.coords.latitude,lng:pos.coords.longitude,t:pos.timestamp};
    walk={pts:[c],len:0};trail.setLatLngs([[c.lat,c.lng]]);
    if(startMarker)startMarker.remove();
    startMarker=L.circleMarker([c.lat,c.lng],{radius:10,color:"#ff6b2c",fillColor:"#ff6b2c",fillOpacity:.9}).addTo(map);
    $("walk").textContent=t("cancel");$("walk").className="sec";say(t("goWalk"));
  };
  navigator.geolocation.getCurrentPosition(go,e=>say(t("needPerm",{e:e.message})),{enableHighAccuracy:true});
}
function stopWalk(){walk=null;trail.setLatLngs([]);if(startMarker){startMarker.remove();startMarker=null}$("walk").textContent=t("walkStart");$("walk").className=""}
async function finish(){
  const pts=walk.pts,a=areaM2(pts);
  if(a<800){say(t("tooSmall",{a:fmt(a)}));return}
  if(a>2e6){say(t("tooBig"));stopWalk();return}
  const step=Math.max(1,Math.floor(pts.length/60));
  const poly=pts.filter((_,i)=>i%step===0).map(p=>({lat:+p.lat.toFixed(6),lng:+p.lng.toFixed(6)}));
  try{await addDoc(collection(db,"claims"),{uid:S.uid,n:S.me.n,k:S.me.k,pts:poly,area:Math.round(a),t:Date.now()});say(t("claimed",{a:fmt(a)}))}
  catch(e){say(t("saveFail",{e:e.message}))}
  stopWalk();
}
$("walk").onclick=()=>walk?(stopWalk(),say(t("cancelled"))):startWalk();
if(navigator.geolocation)watch=navigator.geolocation.watchPosition(onPos,()=>{},{enableHighAccuracy:true,maximumAge:2000});

// ---------- Çizim ve listeler ----------
function render(){
  claimLayer.clearLayers();
  const pl={},kg={};
  S.claims.forEach(c=>{
    L.polygon(c.pts.map(p=>[p.lat,p.lng]),{color:colorOf(c.k),weight:3,fillOpacity:.32}).bindTooltip(esc(c.n)+" · "+fmt(c.area)).addTo(claimLayer);
    pl[c.uid]=pl[c.uid]||{n:c.n,k:c.k,a:0};pl[c.uid].a+=c.area;kg[c.k]=(kg[c.k]||0)+c.area;
  });
  const rows=Object.values(pl).sort((a,b)=>b.a-a.a).slice(0,20);
  $("lb").innerHTML=rows.length?rows.map((r,i)=>`<div class="row"><span><span class="dot" style="background:${colorOf(r.k)}"></span>${i+1}. ${esc(r.n)} <span class="mt">${esc((S.kings[r.k]||{}).name||"")}</span></span><b>${fmt(r.a)}</b></div>`).join(""):'<p class="mt">'+t("noLand")+'</p>';
  const ks=Object.keys(S.kings).map(id=>({n:S.kings[id].name,c:S.kings[id].color,a:kg[id]||0,m:Object.values(S.players).filter(p=>p.k===id).length})).sort((a,b)=>b.a-a.a);
  $("kg").innerHTML=ks.length?ks.map(r=>`<div class="row"><span><span class="dot" style="background:${r.c}"></span>${esc(r.n)} <span class="mt">${r.m} ${t("members")}</span></span><b>${fmt(r.a)}</b></div>`).join(""):'<p class="mt">'+t("noKing")+'</p>';
  const sel=$("ks"),cur=sel.value;
  sel.innerHTML='<option value="">'+t("joinK")+'</option>'+Object.keys(S.kings).map(k=>`<option value="${esc(k)}">${esc(S.kings[k].name)}</option>`).join("");sel.value=cur;
  const ch=$("chan");
  ch.innerHTML='<option value="all">'+t("general")+'</option>'+(S.me?`<option value="${esc(S.me.k)}">${t("myK")}: ${esc((S.kings[S.me.k]||{}).name||"")}</option>`:"");ch.value=S.chan;
  $("log").innerHTML=S.chat.filter(m=>m.c===S.chan).slice(-40).map(m=>`<div><b style="color:${colorOf(m.k)}">${esc(m.n)}</b> ${esc(m.x)}</div>`).join("")||'<p class="mt">'+t("noMsg")+'</p>';
  $("log").scrollTop=1e9;
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id===b.dataset.t));
  setTimeout(()=>map.invalidateSize(),50);
});
$("chan").onchange=e=>{S.chan=e.target.value;render()};
$("send").onclick=async()=>{
  const t=$("txt").value.trim();if(!t||!S.me)return;$("txt").value="";
  try{await addDoc(collection(db,"chat"),{uid:S.uid,n:S.me.n,k:S.me.k,c:S.chan,x:t,t:Date.now()})}catch(e){}
};
$("txt").onkeydown=e=>{if(e.key==="Enter")$("send").click()};

// ---------- Kayıt ----------
function enter(me){S.me=me;$("join").classList.add("hide");$("me").textContent=me.n+" · "+((S.kings[me.k]||{}).name||"");render();setTimeout(()=>map.invalidateSize(),100)}
$("go").onclick=async()=>{
  const n=$("nm").value.trim(),nk=$("nk").value.trim();let k=$("ks").value;
  if(!n){$("st").textContent=t("errNick");return}
  try{
    if(nk){const color=COLORS[Object.keys(S.kings).length%COLORS.length];const r=await addDoc(collection(db,"kingdoms"),{name:nk,color,owner:S.uid});k=r.id;S.kings[k]={name:nk,color}}
    if(!k){$("st").textContent=t("errKing");return}
    const me={n,k};await setDoc(doc(db,"players",S.uid),me);S.players[S.uid]=me;enter(me);
  }catch(e){$("st").textContent=t("regFail",{e:e.message})}
};

// ---------- Açılış ekranı ----------
const sp=$("splash");setTimeout(()=>{sp.classList.add("gone");setTimeout(()=>sp.remove(),700)},2400);
window.addEventListener("load",()=>map.invalidateSize());setTimeout(()=>map.invalidateSize(),400);

// ---------- Başlangıç ----------
onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth).catch(e=>$("st").textContent=t("authErr",{e:e.message}));return}
  S.uid=u.uid;
  onSnapshot(collection(db,"kingdoms"),s=>{S.kings={};s.docs.forEach(d=>S.kings[d.id]=d.data());render()});
  onSnapshot(collection(db,"players"),s=>{S.players={};s.docs.forEach(d=>S.players[d.id]=d.data());if(!S.me&&S.players[S.uid])enter(S.players[S.uid]);render()});
  onSnapshot(query(collection(db,"claims"),orderBy("t","desc"),limit(300)),s=>{S.claims=s.docs.map(d=>d.data());render()});
  onSnapshot(query(collection(db,"chat"),orderBy("t","desc"),limit(150)),s=>{S.chat=s.docs.map(d=>d.data()).reverse();render()});
});
</script>
</body>
